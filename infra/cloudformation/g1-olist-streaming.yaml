AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Olist G1 streaming - SQS Standard buffer plus Lambda that writes 60-second micro-batches
  of events as JSONL.gz into the S3 landing layer; Standard over FIFO so batches reach
  1000 messages and avoid the small-files problem in Glue and Athena.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: "Colab simulator -> SQS Standard -> Lambda (no VPC) -> s3 erp/landing (CSV formato Olist + copia cruda eventos/) -> Glue ERP bronze/silver -> gold -> Athena -> Power BI"
    must:
      - "shared AWS account: every named resource uses the Prefijo param (g1-olist); never touch non-g1 resources"
      - "account Lambda concurrency limit is 10: never set ReservedConcurrentExecutions, cap via ESM MaximumConcurrency"
      - "user cannot create log groups: the Lambda role creates /aws/lambda/* at runtime"
      - "at-least-once delivery: downstream bronze must dedupe by evento_id and silver must order by ts_evento"
    owner: "Grupo 1 - Proyecto Integrador DMC"

Parameters:
  Prefijo:
    Type: String
    Default: g1-olist
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Prefijo de nombres para todos los recursos del grupo.
  BucketLakehouse:
    Type: String
    Default: trabajo-integrador-g1
    Description: Bucket del lakehouse (landing, bronze, silver, gold).
  PrefijoLanding:
    Type: String
    Default: erp/landing/
    AllowedPattern: "^[a-z0-9/_-]+/$"
    Description: >-
      Landing del ERP (termina en /). La Lambda escribe la copia cruda en eventos/, los rechazados en
      rechazados/ y los CSV con formato Olist en <entidad>/ (orders, order_items, payments, reviews,
      Incrementales/clientes) para los jobs de bronze del ERP.
  CodigoConsumidorKey:
    Type: String
    Description: Clave S3 (en BucketLakehouse) del zip de la Lambda consumidora, generado por infra/empaquetar_web.py.
  ConcurrenciaMaxima:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 5
    Description: Maximo de Lambdas consumidoras simultaneas.
  TamanoLote:
    Type: Number
    Default: 1000
    MinValue: 10
    MaxValue: 10000
    Description: Mensajes maximos por invocacion (y por archivo en S3).
  VentanaLoteSegundos:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 300
    Description: Segundos que SQS acumula mensajes antes de invocar a la Lambda.

Resources:
  # ---------------------------------------------------------------
  # Colas
  # ---------------------------------------------------------------
  ColaErrores:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: "DLQ for batches that fail 3 times (S3 or Lambda failures); invalid messages go to s3 rechazados instead"
    Properties:
      QueueName: !Sub "${Prefijo}-eventos-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ColaEventos:
    Type: AWS::SQS::Queue
    Metadata:
      com.aws.cloudformation.Context:
        why: "buffer that levels producer bursts; Standard (not FIFO) allows 1000-msg batches + batching window"
        must: ["VisibilityTimeout >= 6x Lambda Timeout + batching window (420 >= 6*60 + 60)"]
        mutability:
          VisibilityTimeout: change-with-constraints
    Properties:
      QueueName: !Sub "${Prefijo}-eventos"
      VisibilityTimeout: 420
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ColaErrores.Arn
        maxReceiveCount: 3

  # SQS exige un solo recurso por sentencia: una politica por cola
  PoliticaColaEventos:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ColaEventos]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt ColaEventos.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  PoliticaColaErrores:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref ColaErrores]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SoloTLS
            Effect: Deny
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt ColaErrores.Arn
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------
  # Lambda consumidor
  # ---------------------------------------------------------------
  RolConsumidor:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefijo}-consumidor-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: sqs-y-landing
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource: !GetAtt ColaEventos.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "arn:aws:s3:::${BucketLakehouse}/${PrefijoLanding}*"

  FuncionConsumidor:
    Type: AWS::Lambda::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: "validates; writes one raw JSONL.gz per batch plus one Olist-format CSV per entity and period; no VPC, stdlib + runtime boto3"
        must: ["Timeout*6 + batching window <= queue VisibilityTimeout"]
    Properties:
      FunctionName: !Sub "${Prefijo}-consumidor"
      Description: Convierte micro-lotes de eventos de SQS en CSV del ERP (y copia cruda) en S3 landing
      Runtime: python3.12
      Architectures: [arm64]
      Handler: handler.lambda_handler
      Code:
        S3Bucket: !Ref BucketLakehouse
        S3Key: !Ref CodigoConsumidorKey
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt RolConsumidor.Arn
      Environment:
        Variables:
          BUCKET: !Ref BucketLakehouse
          PREFIJO_EVENTOS: !Sub "${PrefijoLanding}eventos/"
          PREFIJO_RECHAZADOS: !Sub "${PrefijoLanding}rechazados/"
          PREFIJO_ERP: !Ref PrefijoLanding

  TriggerSqs:
    Type: AWS::Lambda::EventSourceMapping
    Metadata:
      com.aws.cloudformation.Context:
        why: "large batch + window = few large files; MaximumConcurrency caps parallel writers"
        must: ["BatchSize > 10 requires MaximumBatchingWindowInSeconds >= 1"]
    Properties:
      EventSourceArn: !GetAtt ColaEventos.Arn
      FunctionName: !Ref FuncionConsumidor
      BatchSize: !Ref TamanoLote
      MaximumBatchingWindowInSeconds: !Ref VentanaLoteSegundos
      ScalingConfig:
        MaximumConcurrency: !Ref ConcurrenciaMaxima
      Enabled: true

  # ---------------------------------------------------------------
  # Productor Colab: solo puede enviar a la cola
  # ---------------------------------------------------------------
  UsuarioColab:
    Type: AWS::IAM::User
    Metadata:
      com.aws.cloudformation.Context:
        why: "least-privilege identity for the Colab generator"
        must: ["access key is created manually in the console and stored in Colab Secrets; never in this template or its outputs"]
    Properties:
      UserName: !Sub "${Prefijo}-colab-productor"
      Policies:
        - PolicyName: enviar-eventos
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueUrl
                  - sqs:GetQueueAttributes
                Resource: !GetAtt ColaEventos.Arn

  # ---------------------------------------------------------------
  # Soporte del lakehouse: rol de Glue y workgroup de Athena
  # ---------------------------------------------------------------
  RolGlue:
    Type: AWS::IAM::Role
    Metadata:
      com.aws.cloudformation.Context:
        why: "group-owned Glue role so new jobs do not depend on the classmate role <rol-glue-heredado>"
    Properties:
      RoleName: !Sub "${Prefijo}-glue-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: lakehouse
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BucketLakehouse}"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "arn:aws:s3:::${BucketLakehouse}/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::aws-glue-assets-${AWS::AccountId}-${AWS::Region}/*"

  WorkgroupAthena:
    Type: AWS::Athena::WorkGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: "Power BI connects through Athena; per-query scan cap guards cost"
    Properties:
      Name: !Sub "${Prefijo}"
      Description: Consultas del grupo 1 sobre el lakehouse Olist
      State: ENABLED
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: 1073741824
        ResultConfiguration:
          OutputLocation: !Sub "s3://${BucketLakehouse}/athena-resultados/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # ---------------------------------------------------------------
  # Alarmas
  # ---------------------------------------------------------------
  AlarmaDlq:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Prefijo}-dlq-con-mensajes"
      AlarmDescription: Hay lotes que fallaron 3 veces y estan en la DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ColaErrores.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmaAntiguedad:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Prefijo}-cola-atrasada"
      AlarmDescription: El mensaje mas antiguo lleva mas de 5 minutos en la cola
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ColaEventos.QueueName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmaErroresConsumidor:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Prefijo}-consumidor-errores"
      AlarmDescription: La Lambda consumidora fallo
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FuncionConsumidor
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ColaEventosUrl:
    Value: !Ref ColaEventos
  ColaEventosArn:
    Value: !GetAtt ColaEventos.Arn
  ColaErroresUrl:
    Value: !Ref ColaErrores
  FuncionConsumidor:
    Value: !Ref FuncionConsumidor
  UsuarioColab:
    Value: !Ref UsuarioColab
  RolGlueArn:
    Value: !GetAtt RolGlue.Arn
  WorkgroupAthena:
    Value: !Ref WorkgroupAthena
  RutaEventos:
    Value: !Sub "s3://${BucketLakehouse}/${PrefijoLanding}eventos/"
