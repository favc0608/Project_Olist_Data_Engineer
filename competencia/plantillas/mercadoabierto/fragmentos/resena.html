<article class="ml-review-card">
  <div class="ml-review-card__header">
    <span class="ml-review-card__stars" aria-label="Nota $nota de 5">★ $nota/5</span>
    <strong class="ml-review-card__author">$autor</strong>
    <time class="ml-review-card__date">$data</time>
  </div>
  <p class="ml-review-card__body">$texto</p>
</article>
