<div class="s-result-item$classe_estoque" data-component-type="s-search-result" data-asin="$asin" data-sku="$sku_loja" data-ean="$ean"$data_extra>
  <div class="s-card-container">
    <div class="s-image-box">
      $badge_patrocinado
      <a href="$url_produto" class="a-link-normal" aria-label="$marca">
        <div class="s-svg-wrap">$svg</div>
      </a>
    </div>
    <div class="s-card-body">
      <div class="s-brand-line">$marca</div>
      <h2 class="a-size-mini a-spacing-none a-color-base s-line-clamp-2">
        <a class="a-link-normal s-underline-text" href="$url_produto">
          <span class="a-size-medium a-color-base a-text-normal">$titulo_produto</span>
        </a>
      </h2>
      <div class="a-row a-size-small s-rating-row">
        <span class="a-icon-alt">$rating de 5 estrelas</span>
        <span class="s-stars" aria-hidden="true">★★★★★</span>
        <span class="s-underline-text">$avaliacoes</span>
      </div>
      <div class="s-price-block">
        <span class="a-price" data-a-size="xl" data-a-color="base">
          <span class="a-offscreen">$usd_texto</span>
          <span aria-hidden="true">
            <span class="a-price-symbol">US$$</span><span class="a-price-whole">$usd_inteiro<span class="a-price-decimal">.</span></span><span class="a-price-fraction">$usd_fracao</span>
          </span>
        </span>
        <span class="a-price a-text-price" data-a-strike="true">
          <span class="a-offscreen">$usd_lista_texto</span>
          <span aria-hidden="true">$usd_lista_texto</span>
        </span>
        <span class="s-discount-pill">-$desconto%</span>
      </div>
      <div class="a-row a-size-base a-color-secondary">
        <span class="fx-estimate">$brl_estimado</span>
      </div>
      <div class="s-shipping-row">
        <span class="s-prime-badge">$plus</span>
        <span class="s-free-shipping">$frete_gratis</span>
      </div>
      <div class="s-stock-row">
        <span class="s-stock-status">$texto_estoque</span>
      </div>
    </div>
  </div>
</div>
