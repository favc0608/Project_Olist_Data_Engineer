<div class="shopee-search-item-result__item$classe_estoque" data-sqe="item" data-sku="$sku_loja" data-ean="$ean"$data_extra>
  <div class="shopee-item-card">
    <div class="shopee-item-card__image">
      $badge_patrocinado
      <div class="shopee-item-card__discount-badge">-$desconto%</div>
      <a href="$url_produto" aria-label="$marca">
        <div class="shopee-item-card__svg">$svg</div>
      </a>
    </div>
    <div class="shopee-item-card__body">
      <div class="shopee-item-card__brand">$marca</div>
      <div class="shopee-item-card__text-name"><a href="$url_produto">$titulo_produto</a></div>
      <div class="shopee-item-card__price-row">
        <span class="shopee-item-card__original-price">$preco_original</span>
        <div class="shopee-item-card__current-price">$preco_html</div>
      </div>
      <div class="shopee-item-card__meta-row">
        <span class="shopee-item-card__rating">★ $rating ($avaliacoes)</span>
        <div class="shopee-item-card__sold-count">$vendidos</div>
      </div>
      <div class="shopee-item-card__footer-row">
        <span class="shopee-item-card__location">$localizacao</span>
        <span class="shopee-item-card__free-ship">$frete_gratis</span>
      </div>
      <div class="shopee-item-card__stock-row">
        <span class="shopee-item-card__stock-badge">$texto_estoque</span>
      </div>
    </div>
  </div>
</div>
